name: Validate Release Readiness

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-pr:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.ref == 'knope/release' &&
           github.event.pull_request.head.repo.full_name == github.repository) }}
    name: validate-release-pr
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.2
          github-token: ${{ github.token }}

      - name: Validate Knope configuration
        run: knope --validate
