name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref == 'knope/release' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Enables npm trusted publishing.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Set up Node for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Run workflow regression tests
        run: |
          bash .github/scripts/workflow-security.test.sh
          bash .github/scripts/dependabot-changeset.test.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit high and critical vulnerabilities
        run: bun run audit:ci

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Run Effect diagnostics
        run: bun run effect:diagnostics

      - name: Run tests with coverage thresholds
        run: bun run test:coverage

      - name: Build packages
        run: bun run build

      - name: Verify package archives and consumer installation
        run: bun run pack:check

      - name: Check if effect-platform-angular version is unpublished
        id: check_effect_platform_angular
        working-directory: dist/effect-platform-angular
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published. Skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet. Will publish."
          fi

      - name: Publish effect-platform-angular to npm
        if: steps.check_effect_platform_angular.outputs.publish == 'true'
        working-directory: dist/effect-platform-angular
        env:
          NODE_AUTH_TOKEN: ''
        run: npm publish

      - name: Check if effect-angular-query version is unpublished
        id: check_effect_angular_query
        working-directory: dist/effect-angular-query
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published. Skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet. Will publish."
          fi

      - name: Publish effect-angular-query to npm
        if: steps.check_effect_angular_query.outputs.publish == 'true'
        working-directory: dist/effect-angular-query
        env:
          NODE_AUTH_TOKEN: ''
        run: npm publish
