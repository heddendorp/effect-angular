name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.15.0'

      - name: Run workflow regression tests
        run: |
          bash .github/scripts/workflow-security.test.sh
          bash .github/scripts/dependabot-changeset.test.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit high and critical vulnerabilities
        run: bun run audit:ci

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Run Effect diagnostics
        run: bun run effect:diagnostics

      - name: Run tests with coverage thresholds
        id: tests
        run: bun run test:coverage

      - name: Summarize coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Save coverage reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Build packages
        run: bun run build

      - name: Verify package archives and consumer installation
        run: bun run pack:check

  report-coverage:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    steps:
      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      - name: Report effect-platform-angular line coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage/effect-platform-angular/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/effect-platform-angular
      - name: Report effect-angular-query line coverage
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage/effect-angular-query/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/effect-angular-query
