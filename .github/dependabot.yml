version: 2

# Keep the default branch implicit because fetch-metadata derives the directory from the branch name.
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    # repos/effect is read-only upstream reference material, not part of this workspace.
    exclude-paths:
      - 'repos/effect/**'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '08:00'
      timezone: 'UTC'
    open-pull-requests-limit: 8
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'dependabot'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'ng-packagr'
        update-types:
          - 'patch'
          - 'minor'
      effect:
        patterns:
          - '@effect/*'
          - 'effect'
        update-types:
          - 'patch'
          - 'minor'
      tanstack:
        patterns:
          - '@tanstack/*'
        update-types:
          - 'patch'
          - 'minor'
      tooling:
        patterns:
          - 'typescript'
          - 'vitest'
          - '@vitest/*'
          - 'jsdom'
          - '@types/node'
        update-types:
          - 'patch'
          - 'minor'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '08:30'
      timezone: 'UTC'
    open-pull-requests-limit: 3
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'dependabot'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
