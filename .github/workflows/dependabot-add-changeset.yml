name: Classify Dependabot Updates

on:
  pull_request_target:
    types:
      - opened
      - synchronize
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-classify-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  classify:
    if: >-
      ${{ github.repository == 'heddendorp/effect-angular' &&
          github.event.sender.id == 49699333 &&
          github.event.pull_request.user.id == 49699333 &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
          github.event.pull_request.draft == false }}
    name: classify-dependabot-update
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted policy code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch verified Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Capture pull request snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "${current_head}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "Pull request head changed during classification."
            exit 1
          fi

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" |
            jq -s 'add' > "${RUNNER_TEMP}/dependabot-files.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" |
            jq -s 'add' > "${RUNNER_TEMP}/dependabot-commits.json"

      - name: Store metadata as data
        env:
          UPDATED_DEPENDENCIES_JSON: ${{ steps.dependabot-metadata.outputs.updated-dependencies-json }}
        run: printf '%s\n' "${UPDATED_DEPENDENCIES_JSON}" > "${RUNNER_TEMP}/dependabot-metadata.json"

      - name: Classify update and prepare policy artifact
        id: policy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PACKAGE_ECOSYSTEM: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.dependabot-metadata.outputs.dependency-names }}
          DEPENDENCY_GROUP: ${{ steps.dependabot-metadata.outputs.dependency-group }}
          DEPENDENCY_TYPE: ${{ steps.dependabot-metadata.outputs.dependency-type }}
          UPDATED_DEPENDENCIES_JSON_FILE: ${{ runner.temp }}/dependabot-metadata.json
          CHANGED_FILES_JSON_FILE: ${{ runner.temp }}/dependabot-files.json
          COMMIT_ATTESTATIONS_JSON_FILE: ${{ runner.temp }}/dependabot-commits.json
          ARTIFACT_DIR: ${{ runner.temp }}/dependabot-policy
        run: bash .github/scripts/dependabot-changeset.sh classify

      - name: Explain manual handling
        if: steps.policy.outputs.automerge_eligible != 'true'
        env:
          REASON: ${{ steps.policy.outputs.reason }}
        run: echo "Dependabot update requires manual handling. Reason=${REASON}"

      - name: Upload eligible policy artifact
        if: steps.policy.outputs.automerge_eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-policy-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dependabot-policy
          if-no-files-found: error
          retention-days: 1
