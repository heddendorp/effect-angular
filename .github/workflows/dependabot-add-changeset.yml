name: Add Changeset for Dependabot PRs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'projects/**/package.json'

permissions:
  contents: read
  pull-requests: read # Fetches Dependabot pull-request metadata.

concurrency:
  group: dependabot-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  add-changeset:
    if: >-
      ${{ github.event.sender.id == 49699333 &&
          github.event.pull_request.user.id == 49699333 }}
    name: add-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Dependabot branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Decide changeset scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PACKAGE_ECOSYSTEM: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
          DEPENDENCY_GROUP: ${{ steps.dependabot-metadata.outputs.dependency-group }}
          DEPENDENCY_TYPE: ${{ steps.dependabot-metadata.outputs.dependency-type }}
          UPDATED_DEPENDENCIES_JSON: ${{ steps.dependabot-metadata.outputs.updated-dependencies-json }}
        run: bash .github/scripts/dependabot-changeset.sh scope

      - name: Log skip reason
        if: steps.scope.outputs.should_create != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          echo "No changeset created."
          echo "Reason: ${REASON}"

      - name: Create changeset file
        if: steps.scope.outputs.should_create == 'true'
        id: create-changeset
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPENDENCY_NAMES: ${{ steps.dependabot-metadata.outputs.dependency-names }}
          UPDATED_DEPENDENCIES_JSON: ${{ steps.dependabot-metadata.outputs.updated-dependencies-json }}
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
          BUMP_PLATFORM: ${{ steps.scope.outputs.bump_platform }}
          BUMP_QUERY: ${{ steps.scope.outputs.bump_query }}
        run: bash .github/scripts/dependabot-changeset.sh create

      - name: Commit and push changeset
        if: steps.scope.outputs.should_create == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_PUSH_TOKEN }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          FILE: ${{ steps.create-changeset.outputs.file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing required Dependabot secret: DEPENDABOT_PUSH_TOKEN"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${FILE}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(changeset): add dependabot changeset for #${PR_NUMBER}"
          gh auth setup-git
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH_NAME}"
