version: 2

# Keep the default branch implicit because fetch-metadata derives the directory from the branch name.
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    # Vendored repositories are read-only upstream references.
    exclude-paths:
      - 'repos/**'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '08:00'
      timezone: 'UTC'
    open-pull-requests-limit: 8
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'dependabot'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'ng-packagr'
        update-types:
          - 'patch'
          - 'minor'
      effect:
        patterns:
          - '@effect/*'
          - 'effect'
        update-types:
          - 'patch'
          - 'minor'
      tanstack:
        patterns:
          - '@tanstack/*'
        update-types:
          - 'patch'
          - 'minor'
      tooling:
        patterns:
          - 'typescript'
          - 'vitest'
          - '@vitest/*'
          - 'jsdom'
          - '@types/node'
        update-types:
          - 'patch'
          - 'minor'

  # GitHub reports security updates for vendored pnpm manifests under the npm ecosystem.
  - package-ecosystem: 'npm'
    directories:
      - '/repos/**/*'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '08:30'
      timezone: 'UTC'
    open-pull-requests-limit: 3
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'dependabot'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
